<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trombi — mes élèves</title>
<meta name="description" content="Apprendre les noms de ses élèves en jouant">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--text:#16211f;--muted:#5b6965;--line:#dde3e1;
  --brand:#0f766e;--brand-ink:#fff;--ok:#15803d;--ok-bg:#dcfce7;--ko:#b91c1c;--ko-bg:#fee2e2;
  --c6A:#2563eb;--c6B:#c026d3;--c6C:#c2410c;--c5B:#047857;--c5C:#7c3aed;
  --r:16px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1514;--card:#17211f;--text:#e8efed;--muted:#9fb0ab;--line:#2a3734;
  --brand:#2dd4bf;--brand-ink:#04201c;--ok:#4ade80;--ok-bg:#12321f;--ko:#f87171;--ko-bg:#3a1515;
  --c6A:#60a5fa;--c6B:#e879f9;--c6C:#fb923c;--c5B:#34d399;--c5C:#a78bfa;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;transition:transform .15s ease-out,background-color .15s ease-out,opacity .15s ease-out}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:48px}
.top h1{font-size:1.25rem;flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem}
.iconbtn:hover{background:var(--line)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.btn{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.block{display:block;width:100%}
.stack>*+*{margin-top:12px}
/* classes */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--cc,var(--line));color:var(--cc,var(--text));border-radius:999px;padding:6px 14px;font-weight:700;background:transparent}
.chip[aria-pressed="true"]{background:var(--cc);color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#0e1514}}
/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:96px}
.mode b{font-size:1rem}
.mode .e{font-size:1.6rem;line-height:1}
.mode span.small{color:var(--muted)}
.mode.wide{grid-column:1/-1}
/* progress */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--cc,var(--brand));border-radius:99px;transition:width .3s ease-out}
.prow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:6px 0}
.tag{font-weight:800;color:var(--cc)}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .bar{flex:1}
.photo{width:min(62vw,240px);aspect-ratio:137/175;object-fit:cover;border-radius:14px;display:block;margin:0 auto;background:var(--line)}
.prompt{text-align:center;margin:12px 0 14px;font-size:1.1rem;font-weight:600}
.choices{display:grid;gap:8px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;min-height:52px}
.choice .n{font-size:.8rem;color:var(--muted);display:block}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ko{border-color:var(--ko);background:var(--ko-bg)}
.choice[disabled]{cursor:default}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pchoice{padding:0;border:3px solid transparent;border-radius:16px;overflow:hidden;background:var(--line)}
.pchoice img{width:100%;aspect-ratio:137/175;object-fit:cover;display:block}
.pchoice.ok{border-color:var(--ok)}.pchoice.ko{border-color:var(--ko)}
.big-name{text-align:center;font-size:1.5rem;font-weight:800;margin:6px 0 2px}
.feedback{min-height:28px;text-align:center;font-weight:700;margin-top:10px}
.feedback.ok{color:var(--ok)}.feedback.ko{color:var(--ko)}
.typing{display:flex;gap:8px}
.typing input{flex:1;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);min-height:48px}
.timer{font-weight:800;font-size:1.1rem;min-width:3ch;text-align:right}
/* trombi */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tcell{padding:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tcell img,.tcell .noimg{width:100%;aspect-ratio:137/175;object-fit:cover;display:block;background:var(--line)}
.noimg{display:grid!important;place-items:center;font-size:1.6rem;font-weight:800;color:var(--muted)}
.tcell .lbl{padding:6px 4px;font-size:.78rem;line-height:1.2;min-height:3.2em}
.tcell .lbl b{display:block;font-size:.85rem}
.masked .lbl{color:transparent}
.masked .tcell.show .lbl{color:var(--text)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
/* result */
.score{font-size:2.6rem;font-weight:800;text-align:center}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s ease-out;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" class="hidden">
<script>
'use strict';
const VERSION='1.0.0';
const ORDRE=['6A','6B','6C','5B','5C'];
const LS_PROG='trombi.progress.v1', LS_SEL='trombi.sel.v1', LS_BEST='trombi.best.v1';
const app=document.getElementById('app');

/* ---------- utilitaires ---------- */
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs) for(const[k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='style') e.style.cssText=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k instanceof Node?k:document.createTextNode(String(k))); }
  return e;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const ccol=c=>`--cc:var(--c${c})`;
const nomComplet=s=>s.prenom+' '+s.nom;
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

/* ---------- stockage IndexedDB ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('trombi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};

/* ---------- état ---------- */
let DATA=null;         // {annee, classes:{cls:[{prenom,nom,photo}]}}
let ELEVES=[];         // liste à plat avec id et cls
let PROG=lsGet(LS_PROG,{}); // id -> {b:boîte 0..5, v:vus, ok:réussites}
let SEL=lsGet(LS_SEL,null);

function valider(j){
  if(!j||typeof j!=='object'||j.type!=='trombi-eleves'||!j.classes||typeof j.classes!=='object') throw new Error('Ce fichier n\'est pas un fichier d\'élèves Trombi.');
  const classes={};
  for(const[c,arr] of Object.entries(j.classes)){
    if(!/^[\w°\- ]{1,12}$/.test(c)||!Array.isArray(arr)) throw new Error('Classe invalide : '+c);
    classes[c]=arr.map(s=>{
      if(typeof s.prenom!=='string'||typeof s.nom!=='string') throw new Error('Élève invalide dans '+c);
      const photo=(typeof s.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s.photo))?s.photo:null;
      return{prenom:s.prenom.slice(0,60),nom:s.nom.slice(0,80),photo};
    });
  }
  return{annee:String(j.annee||'').slice(0,20),classes};
}
function charger(d){
  DATA=d;ELEVES=[];
  const cls=Object.keys(d.classes).sort((a,b)=>(ORDRE.indexOf(a)+99*(ORDRE.indexOf(a)<0))-(ORDRE.indexOf(b)+99*(ORDRE.indexOf(b)<0))||a.localeCompare(b));
  for(const c of cls) for(const s of d.classes[c]) ELEVES.push({...s,cls:c,id:c+'|'+s.nom+'|'+s.prenom});
  if(!SEL||!SEL.length||SEL.some(c=>!d.classes[c])) SEL=cls.slice();
}
const classes=()=>DATA?[...new Set(ELEVES.map(e=>e.cls))]:[];
const pool=(photoOnly=true)=>ELEVES.filter(e=>SEL.includes(e.cls)&&(!photoOnly||e.photo));
const box=id=>(PROG[id]?.b)||0;
const maitrise=list=>list.length?list.filter(e=>box(e.id)>=3).length/list.length:0;

function noter(e,ok){
  const p=PROG[e.id]||{b:0,v:0,ok:0};
  p.v++; if(ok){p.ok++;p.b=Math.min(5,p.b+1)} else p.b=0;
  PROG[e.id]=p; lsSet(LS_PROG,PROG);
}
/* tirage pondéré : les élèves mal connus reviennent plus souvent */
function tirer(list,n){
  const w=e=>[10,6,3,1.5,.7,.35][box(e.id)]*(PROG[e.id]?1:1.4);
  const out=[],rest=list.slice();
  while(out.length<n&&rest.length){
    const tot=rest.reduce((s,e)=>s+w(e),0);let r=Math.random()*tot,i=0;
    for(;i<rest.length-1;i++){r-=w(rest[i]);if(r<=0)break}
    out.push(rest.splice(i,1)[0]);
  }
  return out;
}
/* distracteurs : de préférence même classe, prénoms différents */
function leurres(cible,n,base){
  const memes=shuffle(base.filter(e=>e.id!==cible.id&&e.cls===cible.cls&&norm(e.prenom)!==norm(cible.prenom)));
  const autres=shuffle(base.filter(e=>e.id!==cible.id&&e.cls!==cible.cls&&norm(e.prenom)!==norm(cible.prenom)));
  return memes.concat(autres).slice(0,n);
}

/* ---------- écrans ---------- */
function topbar(titre,retour){
  return el('div',{class:'top'},
    retour?el('button',{class:'iconbtn','aria-label':'Retour',onclick:retour,text:'←'}):null,
    el('h1',{text:titre}),
    !retour&&DATA?el('button',{class:'iconbtn','aria-label':'Réglages',onclick:ecranReglages,text:'⚙️'}):null);
}

function ecranImport(msg){
  app.replaceChildren(
    topbar('Trombi'),
    el('div',{class:'card stack'},
      el('h2',{text:'Apprends les noms de tes élèves'}),
      el('p',{class:'muted',text:'Importe ton fichier d\'élèves (.json). Les photos restent uniquement sur cet appareil : rien n\'est envoyé en ligne.'}),
      msg?el('p',{style:'color:var(--ko);font-weight:600',text:msg}):null,
      el('div',{class:'drop'},
        el('button',{class:'btn',onclick:()=>document.getElementById('file').click(),text:'📂 Choisir le fichier'}))),
    el('footer',{text:'Trombi v'+VERSION}));
}

function ecranAccueil(){
  const cls=classes();
  const chips=el('div',{class:'chips'},cls.map(c=>el('button',{class:'chip',style:ccol(c),'aria-pressed':String(SEL.includes(c)),onclick:()=>{
    if(SEL.includes(c)){if(SEL.length===1)return toast('Garde au moins une classe');SEL=SEL.filter(x=>x!==c)}else SEL=cls.filter(x=>SEL.includes(x)||x===c);
    lsSet(LS_SEL,SEL);ecranAccueil();}},c)));
  const n=pool(false).length, m=Math.round(maitrise(pool(false))*100);
  const mode=(e,t,d,fn,wide)=>el('button',{class:'mode'+(wide?' wide':''),onclick:fn},el('span',{class:'e',text:e}),el('b',{text:t}),el('span',{class:'small',text:d}));
  const best=lsGet(LS_BEST,{});
  app.replaceChildren(
    topbar('Trombi'),
    el('div',{class:'card stack'},
      el('div',{style:'display:flex;justify-content:space-between;align-items:baseline'},el('b',{text:'Classes'}),
        el('button',{class:'small muted',style:'min-height:32px',onclick:()=>{SEL=SEL.length===cls.length?[cls[0]]:cls.slice();lsSet(LS_SEL,SEL);ecranAccueil()},text:SEL.length===cls.length?'Une seule':'Toutes'})),
      chips,
      el('div',{},el('div',{class:'small muted num',style:'display:flex;justify-content:space-between;margin-bottom:4px'},el('span',{text:n+' élèves'}),el('span',{text:m+' % maîtrisés'})),
        el('div',{class:'bar'},el('i',{style:'width:'+m+'%'})))),
    el('div',{class:'modes',style:'margin-top:14px'},
      mode('🃏','Trombinoscope','Révise, noms cachés ou non',ecranTrombi,true),
      mode('🔤','Qui est-ce ?','Photo → 4 noms',()=>lancer('qcm')),
      mode('⌨️','Écris le prénom','Photo → tu tapes',()=>lancer('saisie')),
      mode('🖼️','Trouve la photo','Nom → 4 photos',()=>lancer('photo')),
      mode('🏫','Quelle classe ?','Photo → classe',()=>lancer('classe')),
      mode('⏱️','Défi 60 secondes','Record : '+(best[SEL.slice().sort().join('+')]??0),()=>lancer('chrono'),true),
      mode('📊','Progression','Qui je connais, qui je confonds',ecranProgres,true)),
    el('footer',{text:'Trombi v'+VERSION+(DATA.annee?' · '+DATA.annee:'')}));
}

function ecranTrombi(){
  let masque=false;
  const grille=el('div',{class:'tgrid'});
  const wrap=el('div',{},grille);
  const remplir=()=>{
    grille.replaceChildren(...pool(false).map(e=>{
      const c=el('button',{class:'tcell','aria-label':nomComplet(e),onclick:()=>{if(masque)c.classList.toggle('show')}},
        e.photo?el('img',{src:e.photo,alt:''}):el('div',{class:'noimg',text:(e.prenom[0]||'?')+(e.nom[0]||'')}),
        el('div',{class:'lbl'},el('b',{text:e.prenom}),e.nom,' ',el('span',{class:'tag',style:ccol(e.cls),text:SEL.length>1?e.cls:''})));
      return c;}));
  };
  const bt=el('button',{class:'btn ghost',onclick:()=>{masque=!masque;wrap.classList.toggle('masked',masque);bt.textContent=masque?'👁️ Afficher les noms':'🙈 Cacher les noms';grille.querySelectorAll('.show').forEach(x=>x.classList.remove('show'))},text:'🙈 Cacher les noms'});
  app.replaceChildren(topbar('Trombinoscope',ecranAccueil),
    el('div',{class:'toolbar'},bt,el('span',{class:'small muted',text:'Noms cachés : touche une photo pour vérifier.'})),wrap);
  remplir();
}

function ecranProgres(){
  const blocs=classes().map(c=>{
    const l=ELEVES.filter(e=>e.cls===c);const m=Math.round(maitrise(l)*100);
    return el('div',{class:'prow',style:ccol(c)},el('span',{class:'tag',text:c}),el('div',{class:'bar'},el('i',{style:'width:'+m+'%'})),el('span',{class:'num small',text:m+' %'}));
  });
  const faibles=pool(false).filter(e=>PROG[e.id]&&box(e.id)<2).sort((a,b)=>(PROG[a.id].ok/PROG[a.id].v)-(PROG[b.id].ok/PROG[b.id].v)).slice(0,24);
  const jamais=pool(false).filter(e=>!PROG[e.id]).length;
  app.replaceChildren(topbar('Progression',ecranAccueil),
    el('div',{class:'card'},el('p',{class:'small muted',style:'margin:0 0 6px',text:'Maîtrisé = bien reconnu au moins 3 fois de suite.'}),blocs),
    el('h3',{style:'margin:18px 0 8px',text:'À retravailler (classes choisies)'}),
    faibles.length?el('div',{class:'mlist'},faibles.map(cellule)):el('p',{class:'muted',text:'Personne pour l\'instant.'}),
    el('p',{class:'small muted',text:jamais+' élève(s) encore jamais vu(s) en jeu.'}),
    faibles.length?el('button',{class:'btn block',onclick:()=>lancer('qcm',faibles.filter(e=>e.photo)),text:'Réviser ces élèves'}):null);
}
function cellule(e){
  return el('div',{class:'tcell'},e.photo?el('img',{src:e.photo,alt:''}):el('div',{class:'noimg',text:e.prenom[0]+e.nom[0]}),
    el('div',{class:'lbl'},el('b',{text:e.prenom}),e.nom,' ',el('span',{class:'tag',style:ccol(e.cls),text:e.cls})));
}

function ecranReglages(){
  const nb=ELEVES.length, sans=ELEVES.filter(e=>!e.photo).length;
  app.replaceChildren(topbar('Réglages',ecranAccueil),
    el('div',{class:'card stack'},
      el('p',{style:'margin:0',text:nb+' élèves chargés dans '+classes().length+' classes'+(sans?' ('+sans+' sans photo, exclus des jeux avec photo)':'')+'.'}),
      el('button',{class:'btn block',onclick:()=>document.getElementById('file').click(),text:'📂 Remplacer le fichier d\'élèves'}),
      el('button',{class:'btn ghost block',onclick:()=>{if(confirmer('Remettre toute la progression à zéro ?')){PROG={};lsSet(LS_PROG,PROG);lsSet(LS_BEST,{});toast('Progression remise à zéro')}},text:'↺ Remettre la progression à zéro'}),
      el('button',{class:'btn ghost block',style:'color:var(--ko)',onclick:async()=>{if(confirmer('Effacer les élèves et les photos de cet appareil ?')){await DB.del('data');PROG={};lsSet(LS_PROG,PROG);lsSet(LS_BEST,{});DATA=null;ELEVES=[];ecranImport()}},text:'🗑️ Effacer les élèves de cet appareil'})),
    el('footer',{text:'Trombi v'+VERSION+' · données stockées uniquement sur cet appareil · Icône : Twemoji (CC-BY 4.0)'}));
}
/* confirmation en deux appuis (pas de boîte de dialogue bloquante) */
function confirmer(msg){
  if(confirmer.k===msg&&Date.now()-confirmer.t<4000){confirmer.k=null;return true}
  confirmer.k=msg;confirmer.t=Date.now();toast(msg+' Appuie encore pour confirmer.');return false;
}

/* ---------- jeux ---------- */
let partie=null;
function lancer(mode,liste){
  const base=pool(true);
  if(mode==='classe'&&classes().length<2) return toast('Il faut au moins deux classes');
  if(base.length<4) return toast('Pas assez d\'élèves avec photo dans la sélection');
  const N=mode==='chrono'?999:10;
  const cibles=liste&&liste.length?shuffle(liste).slice(0,N):tirer(base,Math.min(N,base.length));
  partie={mode,base,cibles,i:0,score:0,rates:[],fin:mode==='chrono'?Date.now()+60000:0,verrou:false};
  if(mode==='chrono'){partie.timer=setInterval(()=>{const t=Math.max(0,Math.ceil((partie.fin-Date.now())/1000));const e=document.getElementById('tps');if(e)e.textContent=t+' s';if(t<=0)terminer()},250)}
  question();
}
function quitter(){if(partie?.timer)clearInterval(partie.timer);partie=null;ecranAccueil()}

function question(){
  const p=partie; if(!p) return;
  if(p.mode!=='chrono'&&p.i>=p.cibles.length) return terminer();
  if(p.mode==='chrono'&&p.i>=p.cibles.length) p.cibles.push(...tirer(p.base,Math.min(20,p.base.length)));
  const e=p.cibles[p.i]; p.verrou=false;
  const sousmode=p.mode==='chrono'?(Math.random()<.7?'qcm':'photo'):p.mode;
  const titres={qcm:'Qui est-ce ?',saisie:'Écris le prénom',photo:'Trouve la photo',classe:'Quelle classe ?'};
  const prog=p.mode==='chrono'
    ?[el('span',{class:'num',text:'✔ '+p.score}),el('div',{class:'bar'},el('i',{style:'width:100%'})),el('span',{class:'timer num',id:'tps',text:Math.ceil((p.fin-Date.now())/1000)+' s'})]
    :[el('span',{class:'num small',text:(p.i+1)+'/'+p.cibles.length}),el('div',{class:'bar'},el('i',{style:'width:'+(p.i/p.cibles.length*100)+'%'})),el('span',{class:'num small',text:'✔ '+p.score})];
  const fb=el('div',{class:'feedback',role:'status','aria-live':'polite'});
  const zone=el('div');
  app.replaceChildren(topbar(p.mode==='chrono'?'Défi 60 secondes':titres[sousmode],quitter),el('div',{class:'qhead'},prog),zone,fb);

  const suite=(ok,msg)=>{
    p.verrou=true; noter(e,ok);
    if(ok)p.score++; else p.rates.push(e);
    fb.className='feedback '+(ok?'ok':'ko'); fb.textContent=msg;
    p.i++;
    if(ok||p.mode==='chrono') setTimeout(question,ok?850:1400);
    else zone.append(el('button',{class:'btn block',style:'margin-top:12px',onclick:question,text:'Suivant →'}));
    if(!ok&&p.mode!=='chrono') setTimeout(()=>zone.querySelector('.btn')?.focus(),50);
  };

  if(sousmode==='qcm'||sousmode==='classe'){
    zone.append(el('img',{class:'photo',src:e.photo,alt:'Photo de l\'élève à reconnaître'}));
    let opts;
    if(sousmode==='qcm'){
      opts=shuffle([e,...leurres(e,3,p.base)]).map(o=>({lab:nomComplet(o),sub:SEL.length>1?o.cls:'',ok:o.id===e.id}));
    }else{
      opts=classes().map(c=>({lab:c,ok:c===e.cls,cc:c}));
    }
    zone.append(el('div',{class:'prompt',text:sousmode==='qcm'?'Comment s\'appelle cet élève ?':'Dans quelle classe est cet élève ?'}));
    const box_=el('div',{class:'choices',style:sousmode==='classe'?'grid-template-columns:repeat(auto-fit,minmax(90px,1fr))':''});
    const bts=opts.map(o=>{const b=el('button',{class:'choice',style:o.cc?ccol(o.cc)+';text-align:center;font-weight:800;color:var(--cc)':'',onclick:()=>{
      if(p.verrou)return; bts.forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add('ok')});
      if(!o.ok)b.classList.add('ko');
      suite(o.ok,o.ok?'Bravo ! '+(sousmode==='classe'?nomComplet(e)+', '+e.cls:''):'C\'est '+nomComplet(e)+' ('+e.cls+')');}},
      o.lab,o.sub?el('span',{class:'n',text:o.sub}):null);return b});
    box_.append(...bts); zone.append(box_);
  }
  else if(sousmode==='photo'){
    const opts=shuffle([e,...leurres(e,3,p.base)]);
    zone.append(el('div',{class:'big-name',text:nomComplet(e)}),el('div',{class:'prompt muted',style:'margin-top:0',text:SEL.length>1?e.cls:'Touche sa photo'}));
    const g=el('div',{class:'pgrid'});
    const bts=opts.map(o=>{const b=el('button',{class:'pchoice','aria-label':'Choix de photo',onclick:()=>{
      if(p.verrou)return; bts.forEach((x,k)=>{x.disabled=true;if(opts[k].id===e.id)x.classList.add('ok')});
      const ok=o.id===e.id; if(!ok)b.classList.add('ko');
      suite(ok,ok?'Bravo !':'Raté : tu as touché '+nomComplet(o));}},el('img',{src:o.photo,alt:''}));return b});
    g.append(...bts); zone.append(g);
  }
  else if(sousmode==='saisie'){
    const inp=el('input',{type:'text',autocomplete:'off',autocapitalize:'words',spellcheck:'false','aria-label':'Prénom de l\'élève',placeholder:'Prénom…'});
    const verif=()=>{
      if(p.verrou)return; const v=norm(inp.value); if(!v) return;
      const full=norm(e.prenom), first=full.split(' ')[0];
      const exact=v===full||v===first;
      const proche=!exact&&(lev(v,first)<=1&&first.length>3||lev(v,full)<=1&&full.length>3);
      inp.disabled=true;
      if(exact) suite(true,'Bravo ! '+nomComplet(e));
      else if(proche) suite(true,'Presque ! Ça s\'écrit '+e.prenom+' '+e.nom);
      else suite(false,'C\'est '+nomComplet(e)+' ('+e.cls+')');
    };
    const form=el('form',{class:'typing',onsubmit:ev=>{ev.preventDefault();verif()}},inp,el('button',{class:'btn',type:'submit',text:'OK'}));
    zone.append(el('img',{class:'photo',src:e.photo,alt:'Photo de l\'élève à reconnaître'}),
      el('div',{class:'prompt',text:'Quel est son prénom ?'}),form,
      el('button',{class:'small muted',style:'display:block;margin:6px auto 0',type:'button',onclick:()=>{if(!p.verrou){inp.disabled=true;suite(false,'C\'est '+nomComplet(e)+' ('+e.cls+')')}},text:'Je ne sais pas'}));
    setTimeout(()=>inp.focus(),60);
  }
}

function terminer(){
  const p=partie; if(!p) return; if(p.timer)clearInterval(p.timer);
  let record='';
  if(p.mode==='chrono'){
    const k=SEL.slice().sort().join('+'),best=lsGet(LS_BEST,{});
    if(p.score>(best[k]||0)){best[k]=p.score;lsSet(LS_BEST,best);record='🏆 Nouveau record !'}
  }
  const total=p.mode==='chrono'?p.i:p.cibles.length;
  const rates=[...new Map(p.rates.map(e=>[e.id,e])).values()];
  const mode=p.mode; partie=null;
  app.replaceChildren(topbar('Résultat',ecranAccueil),
    el('div',{class:'card',style:'text-align:center'},
      el('div',{class:'score num',text:mode==='chrono'?p.score:(p.score+' / '+total)}),
      el('p',{class:'muted',style:'margin:4px 0 0',text:mode==='chrono'?'bonnes réponses en 60 secondes':(p.score===total?'Sans faute !':p.score>=total*.7?'Bien joué.':'Ça viendra, on recommence ?')}),
      record?el('p',{style:'font-weight:800;margin:8px 0 0',text:record}):null),
    rates.length?el('h3',{style:'margin:18px 0 8px',text:'À revoir'}):null,
    rates.length?el('div',{class:'mlist'},rates.map(cellule)):null,
    el('div',{class:'stack',style:'margin-top:16px'},
      rates.length&&mode!=='chrono'?el('button',{class:'btn block',onclick:()=>lancer(mode,rates),text:'Rejouer les erreurs'}):null,
      el('button',{class:rates.length&&mode!=='chrono'?'btn ghost block':'btn block',onclick:()=>lancer(mode),text:'Nouvelle partie'}),
      el('button',{class:'btn ghost block',onclick:ecranAccueil,text:'Accueil'})));
}

/* ---------- import ---------- */
document.getElementById('file').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    if(f.size>30e6) throw new Error('Fichier trop volumineux.');
    const d=valider(JSON.parse(await f.text()));
    await DB.set('data',d); charger(d); lsSet(LS_SEL,SEL);
    toast(ELEVES.length+' élèves importés'); ecranAccueil();
  }catch(err){ DATA?toast(err.message||'Fichier illisible'):ecranImport(err instanceof SyntaxError?'Fichier illisible (JSON invalide).':err.message) }
});

/* ---------- démarrage ---------- */
(async()=>{
  try{const d=await DB.get('data'); if(d){charger(d);ecranAccueil()} else ecranImport()}
  catch{ecranImport('Stockage indisponible sur ce navigateur (mode privé ?).')}
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
